global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  # Apps run on the host during local dev; actuator is on the management ports.
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:9080"]}]
  - job_name: arqon-core
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:9081"]}]
