# No defaults for secrets: the process must fail fast if they are missing.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
  mail:
    host: ${SMTP_HOST}          # required in prod (startup fails without it)
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
arqon:
  invitation:
    base-url: ${APP_BASE_URL}
    mail-from: ${MAIL_FROM}
  migration:
    url: ${DB_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
  jwt:
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    key-id: ${JWT_KEY_ID}
  # bootstrap-admin.* only via env on first deploy, then removed
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
