spring:
  application:
    name: api-gateway
  profiles:
    default: local
  reactor:
    context-propagation: auto   # keeps trace context across reactive threads
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@ipKeyResolver}"
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: arqon-core
          uri: ${arqon.routes.core-uri}
          predicates:
            - Path=/api/v1/**

server:
  port: 8080

arqon:
  routes:
    core-uri: ${CORE_SERVICE_URI:http://localhost:8081}
  gateway:
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:0}

management:
  server:
    port: 9080              # actuator is NOT served on the public port
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: false        # rate limiter fails open; Redis must not take the gateway out of rotation
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
